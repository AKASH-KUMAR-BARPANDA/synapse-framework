<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Slate / Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131F"/>
      <stop offset="50%" stop-color="#090A10"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>

    <!-- Glass Squircle Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="hubAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Node 3D Gradients -->
    <!-- Center Purple Hub -->
    <radialGradient id="gradHub" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="75%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </radialGradient>

    <!-- Top-Left Mint/Green Node -->
    <radialGradient id="gradMint" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="30%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Top-Right Amber Nodes -->
    <radialGradient id="gradAmber" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Bottom-Left Rose Nodes -->
    <radialGradient id="gradRose" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FECDD3"/>
      <stop offset="30%" stop-color="#FB7185"/>
      <stop offset="75%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </radialGradient>

    <!-- Bottom-Right Cyan Node -->
    <radialGradient id="gradCyan" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>

    <!-- Edge Gradients -->
    <linearGradient id="edgeMintAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="edgeHubMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="edgeHubAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="edgeHubRose" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="edgeHubCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="edgeRoseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Radial Glow Behind Core -->
  <circle cx="256" cy="256" r="210" fill="url(#hubAmbient)"/>

  <!-- ============================================== -->
  <!-- CONNECTING EDGES (With Optical Glow Layers)    -->
  <!-- ============================================== -->
  <g stroke-linecap="round">
    <!-- Edge: Top-Left (Mint) -> Top-Right (Amber) -->
    <line x1="186" y1="188" x2="350" y2="168" stroke="url(#edgeMintAmber)" stroke-width="14" opacity="0.18"/>
    <line x1="186" y1="188" x2="350" y2="168" stroke="url(#edgeMintAmber)" stroke-width="6.5" opacity="0.9"/>

    <!-- Edge: Center (Hub) -> Top-Left (Mint) -->
    <line x1="256" y1="256" x2="186" y2="188" stroke="url(#edgeHubMint)" stroke-width="14" opacity="0.18"/>
    <line x1="256" y1="256" x2="186" y2="188" stroke="url(#edgeHubMint)" stroke-width="6.5" opacity="0.9"/>

    <!-- Edge: Center (Hub) -> Top-Right (Amber) -->
    <line x1="256" y1="256" x2="350" y2="168" stroke="url(#edgeHubAmber)" stroke-width="14" opacity="0.18"/>
    <line x1="256" y1="256" x2="350" y2="168" stroke="url(#edgeHubAmber)" stroke-width="6.5" opacity="0.9"/>

    <!-- Edge: Top-Right (Amber) -> Far Top-Right (Amber) -->
    <line x1="350" y1="168" x2="378" y2="252" stroke="#FBBF24" stroke-width="14" opacity="0.18"/>
    <line x1="350" y1="168" x2="378" y2="252" stroke="#FBBF24" stroke-width="6.5" opacity="0.9"/>

    <!-- Edge: Center (Hub) -> Bottom-Left (Rose) -->
    <line x1="256" y1="256" x2="162" y2="344" stroke="url(#edgeHubRose)" stroke-width="14" opacity="0.18"/>
    <line x1="256" y1="256" x2="162" y2="344" stroke="url(#edgeHubRose)" stroke-width="6.5" opacity="0.9"/>

    <!-- Edge: Bottom-Left (Rose) -> Far Bottom-Left (Rose) -->
    <line x1="162" y1="344" x2="134" y2="260" stroke="#FB7185" stroke-width="14" opacity="0.18"/>
    <line x1="162" y1="344" x2="134" y2="260" stroke="#FB7185" stroke-width="6.5" opacity="0.9"/>

    <!-- Edge: Center (Hub) -> Bottom-Right (Cyan) -->
    <line x1="256" y1="256" x2="326" y2="324" stroke="url(#edgeHubCyan)" stroke-width="14" opacity="0.18"/>
    <line x1="256" y1="256" x2="326" y2="324" stroke="url(#edgeHubCyan)" stroke-width="6.5" opacity="0.9"/>

    <!-- Edge: Bottom-Left (Rose) -> Bottom-Right (Cyan) -->
    <line x1="162" y1="344" x2="326" y2="324" stroke="url(#edgeRoseCyan)" stroke-width="14" opacity="0.18"/>
    <line x1="162" y1="344" x2="326" y2="324" stroke="url(#edgeRoseCyan)" stroke-width="6.5" opacity="0.9"/>
  </g>

  <!-- ============================================== -->
  <!-- GRAPH NODES (Interactive Neural Spheres)       -->
  <!-- ============================================== -->

  <!-- 1. Far Bottom-Left Satellite (Rose) -->
  <g transform="translate(134, 260)">
    <circle cx="0" cy="0" r="28" fill="#F43F5E" opacity="0.15"/>
    <circle cx="0" cy="0" r="19" fill="#0C0E17" stroke="#FB7185" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="15" fill="url(#gradRose)"/>
    <circle cx="-4" cy="-4" r="4.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 2. Bottom-Left Hub (Rose) -->
  <g transform="translate(162, 344)">
    <circle cx="0" cy="0" r="38" fill="#F43F5E" opacity="0.18"/>
    <circle cx="0" cy="0" r="26" fill="#0C0E17" stroke="#FB7185" stroke-width="3"/>
    <circle cx="0" cy="0" r="21" fill="url(#gradRose)"/>
    <circle cx="-6" cy="-6" r="6" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- 3. Bottom-Right Cluster (Cyan) -->
  <g transform="translate(326, 324)">
    <circle cx="0" cy="0" r="38" fill="#0EA5E9" opacity="0.18"/>
    <circle cx="0" cy="0" r="26" fill="#0C0E17" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="0" cy="0" r="21" fill="url(#gradCyan)"/>
    <circle cx="-6" cy="-6" r="6" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- 4. Top-Left Cluster (Mint) -->
  <g transform="translate(186, 188)">
    <circle cx="0" cy="0" r="38" fill="#10B981" opacity="0.18"/>
    <circle cx="0" cy="0" r="26" fill="#0C0E17" stroke="#34D399" stroke-width="3"/>
    <circle cx="0" cy="0" r="21" fill="url(#gradMint)"/>
    <circle cx="-6" cy="-6" r="6" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- 5. Top-Right Cluster (Amber) -->
  <g transform="translate(350, 168)">
    <circle cx="0" cy="0" r="38" fill="#F59E0B" opacity="0.18"/>
    <circle cx="0" cy="0" r="26" fill="#0C0E17" stroke="#FBBF24" stroke-width="3"/>
    <circle cx="0" cy="0" r="21" fill="url(#gradAmber)"/>
    <circle cx="-6" cy="-6" r="6" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- 6. Far Top-Right Satellite (Amber) -->
  <g transform="translate(378, 252)">
    <circle cx="0" cy="0" r="28" fill="#F59E0B" opacity="0.15"/>
    <circle cx="0" cy="0" r="19" fill="#0C0E17" stroke="#FBBF24" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="15" fill="url(#gradAmber)"/>
    <circle cx="-4" cy="-4" r="4.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 7. CENTRAL NEXUS HUB (Indigo/Purple Master) -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="54" fill="#6366F1" opacity="0.22"/>
    <circle cx="0" cy="0" r="38" fill="#0A0C16" stroke="#818CF8" stroke-width="4"/>
    <circle cx="0" cy="0" r="31" fill="url(#gradHub)"/>
    <circle cx="-9" cy="-9" r="9" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-4" cy="-4" r="3" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
