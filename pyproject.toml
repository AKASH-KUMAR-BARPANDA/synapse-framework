[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-framework"
version = "0.2.5"
description = "Modular Multi-MCP & Hybrid RAG AI Application Framework"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Synapse Contributors"}
]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "rag",
    "agents",
    "knowledge-graph",
    "fastapi",
    "claude",
    "cursor",
    "ollama",
    "chromadb",
    "qdrant",
    "networkx",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.142.2",
    "fastembed>=0.8.1",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.7",
    "langchain-ollama>=1.1.0",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "networkx>=3.7",
    "pydantic>=2.13.5",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
mlflow = [
    "mlflow>=2.15.0",
]
qdrant = [
    "qdrant-client>=1.12.0",
]
all = [
    "mlflow>=2.15.0",
    "qdrant-client>=1.12.0",
]
dev = [
    "bandit>=1.9.0",
    "build>=1.2.0",
    "pip-audit>=2.8.0",
    "pytest>=8.0.0",
    "twine>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/AKASH-KUMAR-BARPANDA/synapse-framework"
Repository = "https://github.com/AKASH-KUMAR-BARPANDA/synapse-framework"
Issues = "https://github.com/AKASH-KUMAR-BARPANDA/synapse-framework/issues"

[project.scripts]
synapse = "synapse.cli:main"

[tool.setuptools.packages.find]
include = ["synapse", "synapse.*"]
exclude = ["tests*", "assets*"]

[tool.setuptools.package-data]
synapse = ["py.typed", "skills/premade/**/*.md", "skills/premade/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

